<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pix Automático (mensal) — Instituto Ebenézer</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<!-- Layout desktop (05/10/2026): ver nota em area-doador.html — mesma
     classe, chrome genérico (sidebar fixa + canvas cheio). Confirmado com
     o usuário pra todas as telas do MVP, sem exceção. -->
<body class="layout-desktop">
<div class="tela">
  <div class="header-app">
    <button type="button" class="botao-icone" id="botao-voltar" data-icon="chevron-left" aria-label="Voltar"></button>
    <span class="titulo">Pix Automático (mensal)</span>
    <button type="button" class="botao-icone botao-menu" data-icon="menu" aria-label="Abrir menu"></button>
  </div>

  <div class="conteudo-tela">
    <div class="corpo conteudo-centro">
      <div class="badge-marca">
        <div class="logo-marca" data-icon="book-open"></div>
        <span>Instituto Ebenézer</span>
      </div>

      <p class="titulo-valor" id="titulo-valor">Assinatura de R$ 95,00 / mês via Pix</p>

      <div class="qr-container">
        <div class="qr-visual"><span>PIX PAYMENT</span></div>
      </div>

      <div class="caixa-codigo">
        <p class="rotulo-secao">Código Pix Copia e Cola</p>
        <div class="campo-copiar">
          <span>00020101021226830014br.gov.bcb.pix2561081...</span>
          <button type="button" class="botao-copiar" data-icon="copy" aria-label="Copiar código"></button>
        </div>
      </div>

      <div class="campo-form">
        <label for="campo-email">E-mail (opcional)</label>
        <input type="email" id="campo-email" placeholder="seuemail@exemplo.com" />
      </div>
      <p class="nota-envio">Enviaremos novidades sobre o impacto da sua doação.</p>

      <div class="status-aguardando">
        <span data-icon="loader"></span>
        <span>Após autorizar, a cobrança acontece automaticamente todo mês.</span>
      </div>
    </div>
  </div>

  <div class="rodape">
    <button type="button" class="botao-cta" id="botao-confirmar">Já autorizei o Pix Automático</button>
    <p class="mensagem-erro" id="mensagem-erro"></p>
    <div class="indicador-home"><span></span></div>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/nav-menu.js"></script>
<script>
  const valor = Number(paramUrl("valor"));
  document.getElementById("titulo-valor").textContent = valor
    ? `Assinatura de ${formatarMoeda(valor)} / mês via Pix`
    : "Valor não informado";

  document.getElementById("botao-confirmar").addEventListener("click", async () => {
    const email = document.getElementById("campo-email").value.trim();
    try {
      const doacao = await apiPost("/api/doacoes", {
        valor,
        forma_pagamento: "pix_recorrente",
        recorrente: true,
        email_capturado: email || null,
      });
      await confirmarIndicacaoSeNecessario(doacao.id);
      window.location.href = `confirmacao.html?doacao=${doacao.id}`;
    } catch (erro) {
      document.getElementById("mensagem-erro").textContent = erro.message;
    }
  });
</script>
</body>
</html>

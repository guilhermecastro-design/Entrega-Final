<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — Instituto Ebenézer</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<!-- Layout desktop (05/10/2026): ver nota em area-doador.html — mesma
     classe, chrome genérico (sidebar fixa + canvas cheio). Confirmado com
     o usuário pra todas as telas do MVP, sem exceção. -->
<body class="layout-desktop">
<div class="tela">
  <div class="brand-header">
    <div class="logo">
      <div class="logo-marca" data-icon="book-open"></div>
      <span class="nome">Ebenézer</span>
    </div>
    <button type="button" class="botao-icone botao-menu" data-icon="menu" aria-label="Abrir menu"></button>
  </div>

  <div class="conteudo-tela">
    <div class="corpo" style="gap: 20px;">
      <div>
        <p class="rotulo-secao" style="text-transform:none; color:var(--texto); font-size:18px; margin-bottom: 4px;">
          Entrar na área do doador
        </p>
        <p class="paragrafo-intro">
          Acesse seu histórico de doações, seus marcos de impacto e o painel de transparência.
        </p>
      </div>

      <form id="form-login" class="formulario-conta" style="gap:16px;">
        <div class="campo-form">
          <label for="campo-email">E-mail</label>
          <input type="email" id="campo-email" required autocomplete="email" />
        </div>
        <div class="campo-form">
          <label for="campo-senha">Senha</label>
          <input type="password" id="campo-senha" required autocomplete="current-password" />
        </div>
        <button type="submit" class="botao-cta" id="botao-entrar">Entrar</button>
        <p class="mensagem-erro" id="mensagem-erro"></p>
      </form>

      <p style="text-align:center; font-size:14px; color:var(--texto-mudo); margin: 0;">
        Ainda não tem conta?
        <a href="cadastro.html" style="color:var(--verde); font-weight:600; text-decoration:none;">Criar conta</a>
      </p>
    </div>
  </div>

  <div class="indicador-home"><span></span></div>
</div>

<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/nav-menu.js"></script>
<script>
  // Se já existe uma sessão válida, não faz sentido mostrar o login de novo.
  (async () => {
    const token = tokenSessao();
    if (!token) return;
    try {
      await apiGet("/api/auth/me");
      window.location.href = "area-doador.html";
    } catch (erro) {
      limparSessao();
    }
  })();

  document.getElementById("form-login").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const botao = document.getElementById("botao-entrar");
    const mensagemErro = document.getElementById("mensagem-erro");
    mensagemErro.textContent = "";
    botao.disabled = true;
    botao.textContent = "Entrando...";
    try {
      const resposta = await apiPost("/api/auth/login", {
        email: document.getElementById("campo-email").value.trim(),
        senha: document.getElementById("campo-senha").value,
      });
      salvarSessao(resposta.token);
      window.location.href = "area-doador.html";
    } catch (erro) {
      mensagemErro.textContent = erro.message;
      botao.disabled = false;
      botao.textContent = "Entrar";
    }
  });
</script>
</body>
</html>

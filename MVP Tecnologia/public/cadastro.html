<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Criar conta — Instituto Ebenézer</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="tela">
  <div class="status-bar">
    <span class="hora">9:41</span>
    <div class="icones">
      <span data-icon="signal"></span>
      <span data-icon="wifi"></span>
      <span data-icon="battery"></span>
    </div>
  </div>

  <div class="header-app">
    <button type="button" class="botao-icone" id="botao-voltar" data-icon="chevron-left" aria-label="Voltar"></button>
    <span class="titulo">Criar conta</span>
    <button type="button" class="botao-icone botao-menu" data-icon="menu" aria-label="Abrir menu"></button>
  </div>

  <div class="conteudo-tela">
    <div class="corpo" style="gap: 20px;">
      <p class="paragrafo-intro">
        Crie sua área do doador pra acompanhar seu histórico, seus marcos de impacto e indicar amigos.
      </p>

      <form id="form-cadastro" class="formulario-conta" style="gap:16px;">
        <div class="campo-form">
          <label for="campo-nome">Nome</label>
          <input type="text" id="campo-nome" required autocomplete="name" />
        </div>
        <div class="campo-form">
          <label for="campo-email">E-mail</label>
          <input type="email" id="campo-email" required autocomplete="email" />
        </div>
        <div class="campo-form">
          <label for="campo-senha">Senha</label>
          <input type="password" id="campo-senha" required minlength="6" autocomplete="new-password" />
        </div>
        <div class="campo-form">
          <label for="campo-tipo">Tipo</label>
          <select id="campo-tipo">
            <option value="PF">Pessoa física</option>
            <option value="PJ">Pessoa jurídica</option>
          </select>
        </div>
        <div class="campo-form" id="campo-cpf-cnpj-wrapper" hidden>
          <label for="campo-cpf-cnpj">CNPJ</label>
          <input type="text" id="campo-cpf-cnpj" />
        </div>
        <button type="submit" class="botao-cta" id="botao-criar">Criar conta</button>
        <p class="mensagem-erro" id="mensagem-erro"></p>
      </form>

      <p style="text-align:center; font-size:14px; color:var(--texto-mudo); margin: 0;">
        Já tem conta?
        <a href="login.html" style="color:var(--verde); font-weight:600; text-decoration:none;">Entrar</a>
      </p>
    </div>
  </div>

  <div class="indicador-home"><span></span></div>
</div>

<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/nav-menu.js"></script>
<script>
  // Quando chega aqui vindo de confirmacao.html ("Criar minha área do
  // doador" logo após uma doação avulsa), a doação recém-feita é vinculada
  // à conta nova assim que ela é criada.
  const doacaoId = paramUrl("doacao");

  document.getElementById("campo-tipo").addEventListener("change", (evento) => {
    document.getElementById("campo-cpf-cnpj-wrapper").hidden = evento.target.value !== "PJ";
  });

  document.getElementById("form-cadastro").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const botao = document.getElementById("botao-criar");
    const mensagemErro = document.getElementById("mensagem-erro");
    mensagemErro.textContent = "";
    botao.disabled = true;
    botao.textContent = "Criando...";
    try {
      const resposta = await apiPost("/api/auth/cadastro", {
        nome: document.getElementById("campo-nome").value.trim(),
        email: document.getElementById("campo-email").value.trim(),
        senha: document.getElementById("campo-senha").value,
        tipo: document.getElementById("campo-tipo").value,
        cpf_cnpj: document.getElementById("campo-cpf-cnpj").value.trim() || null,
        doacao_id: doacaoId || null,
      });
      salvarSessao(resposta.token);
      window.location.href = "area-doador.html";
    } catch (erro) {
      mensagemErro.textContent = erro.message;
      botao.disabled = false;
      botao.textContent = "Criar conta";
    }
  });
</script>
</body>
</html>

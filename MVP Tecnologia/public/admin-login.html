<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — Painel administrativo — Instituto Ebenézer</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<!-- Layout desktop (05/10/2026): ver nota em area-doador.html — mesma
     classe, chrome genérico (sidebar fixa + canvas cheio). Confirmado com
     o usuário pra todas as telas do MVP, sem exceção.

     Login separado do login de doador (login.html) de propósito — ver nota
     em server.js (adminAutenticado) e app.js (CHAVE_SESSAO_ADMIN): são duas
     sessões independentes, pra um doador comum nunca conseguir, nem por
     acidente, abrir o painel interno da equipe. -->
<body class="layout-desktop">
<div class="tela">
  <div class="brand-header">
    <div class="logo">
      <div class="logo-marca" data-icon="shield-check"></div>
      <span class="nome">Ebenézer</span>
    </div>
    <button type="button" class="botao-icone botao-menu" data-icon="menu" aria-label="Abrir menu"></button>
  </div>

  <div class="conteudo-tela">
    <div class="corpo" style="gap: 20px;">
      <div>
        <p class="rotulo-secao" style="text-transform:none; color:var(--texto); font-size:18px; margin-bottom: 4px;">
          Painel administrativo — acesso da equipe
        </p>
        <p class="paragrafo-intro">
          Área restrita à equipe do Instituto Ebenézer — acompanhamento de doações e contas de doador.
        </p>
      </div>

      <form id="form-login-admin" class="formulario-conta" style="gap:16px;">
        <div class="campo-form">
          <label for="campo-email">E-mail</label>
          <input type="email" id="campo-email" required autocomplete="email" />
        </div>
        <div class="campo-form">
          <label for="campo-senha">Senha</label>
          <input type="password" id="campo-senha" required autocomplete="current-password" />
        </div>
        <button type="submit" class="botao-cta" id="botao-entrar">Entrar</button>
        <p class="mensagem-erro" id="mensagem-erro"></p>
      </form>

      <p style="text-align:center; font-size:14px; color:var(--texto-mudo); margin: 0;">
        Esta tela é só para a equipe do Instituto. Doador(a)?
        <a href="login.html" style="color:var(--verde); font-weight:600; text-decoration:none;">Entrar na área do doador</a>
      </p>
    </div>
  </div>

  <div class="indicador-home"><span></span></div>
</div>

<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/nav-menu.js"></script>
<script>
  // Se já existe uma sessão de admin válida, não faz sentido mostrar o
  // login de novo.
  (async () => {
    const token = tokenSessaoAdmin();
    if (!token) return;
    try {
      await apiGetAdmin("/api/admin/me");
      window.location.href = "admin.html";
    } catch (erro) {
      limparSessaoAdmin();
    }
  })();

  document.getElementById("form-login-admin").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const botao = document.getElementById("botao-entrar");
    const mensagemErro = document.getElementById("mensagem-erro");
    mensagemErro.textContent = "";
    botao.disabled = true;
    botao.textContent = "Entrando...";
    try {
      const resposta = await apiPostAdmin("/api/admin/login", {
        email: document.getElementById("campo-email").value.trim(),
        senha: document.getElementById("campo-senha").value,
      });
      salvarSessaoAdmin(resposta.token);
      window.location.href = "admin.html";
    } catch (erro) {
      mensagemErro.textContent = erro.message;
      botao.disabled = false;
      botao.textContent = "Entrar";
    }
  });
</script>
</body>
</html>
